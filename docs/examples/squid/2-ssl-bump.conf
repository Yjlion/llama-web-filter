# ssl_bump "bump all": Squid terminates TLS and re-originates it, so the
# filter sees decrypted requests and response bodies. Clients must trust
# the CA named below.
#
#   openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 \
#       -keyout squidCA.pem -out squidCA.pem
#   /usr/lib/squid/security_file_certgen -c -s /var/lib/squid/ssl_db -M 4MB
http_port 3128 ssl-bump \
  cert=/etc/squid/ssl_cert/squidCA.pem \
  generate-host-certificates=on dynamic_cert_mem_cache_size=4MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

acl localnet src 192.168.0.0/16 10.0.0.0/8 127.0.0.0/8
http_access allow localnet
http_access deny all

include /etc/squid/common-icap.conf
