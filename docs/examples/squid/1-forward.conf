# Plain forward proxy. Clients point their browser/OS proxy setting at
# port 3128; only plaintext HTTP is adapted, because HTTPS is a CONNECT
# tunnel Squid does not open.
http_port 3128

acl localnet src 192.168.0.0/16 10.0.0.0/8 127.0.0.0/8
http_access allow localnet
http_access deny all

include /etc/squid/common-icap.conf
