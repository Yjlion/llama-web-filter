# Shared ICAP wiring, included by every example in this directory.
#
# Two services, because each vectoring point sees a different half of the
# transaction: reqmod_precache can block or rewrite a request before Squid
# fetches it, respmod_precache inspects what came back. Configure both -
# with only reqmod, nothing inspects response bodies; with only respmod,
# allowed requests are the only ones that reach the request log.
icap_enable on
icap_preview_enable on
icap_preview_size 4096

# The single most important line in this file. Without it every client in
# the organisation arrives at the filter as Squid's own address, and
# per-client policies (MAC/IP/CIDR tiers) silently stop working.
icap_send_client_ip on
icap_send_client_username on

icap_service wf_req  reqmod_precache  icap://127.0.0.1:1344/reqmod  bypass=off
icap_service wf_resp respmod_precache icap://127.0.0.1:1344/respmod bypass=off

adaptation_access wf_req  allow all
adaptation_access wf_resp allow all
