# Peek at the handshake, splice the hosts that must not be decrypted
# (banking, payroll, certificate-pinned apps), bump the rest.
#
# Spliced connections are invisible to ICAP: no REQMOD and no RESPMOD ever
# runs for anything inside them. The CONNECT that opens the tunnel is still
# adapted, so host-level and category rules still apply - that is the only
# filtering a spliced host can receive.
http_port 3128 ssl-bump \
  cert=/etc/squid/ssl_cert/squidCA.pem \
  generate-host-certificates=on dynamic_cert_mem_cache_size=4MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB

acl step1 at_step SslBump1
acl splice_hosts ssl::server_name .bank.example .payroll.example
ssl_bump peek step1
ssl_bump splice splice_hosts
ssl_bump bump all

acl localnet src 192.168.0.0/16 10.0.0.0/8 127.0.0.0/8
http_access allow localnet
http_access deny all

include /etc/squid/common-icap.conf
