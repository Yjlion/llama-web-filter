# Transparent interception. Clients have no proxy configured; a router
# REDIRECTs their traffic here:
#
#   iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 80  -j REDIRECT --to-port 3129
#   iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 443 -j REDIRECT --to-port 3130
#
# Squid reconstructs the absolute URL from the Host header (or the TLS SNI),
# so the filter sees the same absolute URLs it sees in forward mode.
http_port 3129 intercept
https_port 3130 intercept ssl-bump \
  cert=/etc/squid/ssl_cert/squidCA.pem \
  generate-host-certificates=on dynamic_cert_mem_cache_size=4MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

acl localnet src 192.168.0.0/16 10.0.0.0/8
http_access allow localnet
http_access deny all

include /etc/squid/common-icap.conf
